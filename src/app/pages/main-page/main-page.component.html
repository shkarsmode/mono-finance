<!-- One loading bar for the whole app -->
@if (loadingService.loading$ | async) {
    <div class="progress" role="progressbar" aria-label="Завантаження"><span class="progress__bar"></span></div>
}

<!-- Left rail — always visible on desktop, hidden on mobile in favour of the bottom nav -->
<aside class="rail">
    <div class="rail__brand">
        <span class="rail__mark">M</span>
        <span class="rail__name">mono<span>·</span>finance</span>
    </div>

    <nav class="rail__nav" aria-label="Головне меню">
        @for (item of navItems; track item.path) {
            <a class="rail__link"
               [routerLink]="item.path"
               routerLinkActive="rail__link--active">
                <span class="material-icons-round">{{ item.icon }}</span>
                <span>{{ item.label }}</span>
            </a>
        }
    </nav>

    <span class="rail__spacer"></span>

    <div class="rail__foot">
        <span class="rail__sync">
            <span class="rail__dot"></span>
            Синхронізовано
        </span>
    </div>
</aside>

<div class="main-area">
    <header class="topbar">
        <span class="topbar__spacer"></span>

        <button type="button" class="iconbtn" (click)="syncData()" [disabled]="isSyncing()" aria-label="Синхронізувати зараз">
            <span class="material-icons-round" [class.spinning]="isSyncing()">sync</span>
        </button>
        <!-- Appearance lives here and nowhere else -->
        <button type="button" class="iconbtn" (click)="toggleTheme()" [attr.aria-label]="isDark() ? 'Увімкнути світлу тему' : 'Увімкнути темну тему'">
            <span class="material-icons-round">{{ isDark() ? 'light_mode' : 'dark_mode' }}</span>
        </button>
    </header>

    <main class="content">
        <router-outlet></router-outlet>
    </main>
</div>

<!-- Mobile: five primary destinations -->
<nav class="bottomnav" aria-label="Головне меню">
    @for (item of navItems.slice(0, 5); track item.path) {
        <a class="bottomnav__item"
           [routerLink]="item.path"
           routerLinkActive="bottomnav__item--active">
            <span class="material-icons-round">{{ item.icon }}</span>
            <span class="bottomnav__label">{{ item.label }}</span>
        </a>
    }
</nav>
