<span class="acct__head">
    <span class="acct__label">{{ typeLabel }}</span>
    <span class="acct__cur mono">{{ currencyName }}</span>
</span>

<span class="acct__pan mono">{{ (account ? account.maskedPan[0] : '4444444444444444') | maskedCard }}</span>

<span class="acct__balance num balance-cell">{{ balanceFormatted | number: '1.2-2' }}</span>

@if (account.creditLimit) {
    <span class="acct__meta num">кредитний ліміт {{ (account.creditLimit / 100) | number: '1.0-0' }}</span>
}
