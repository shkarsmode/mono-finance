<!doctype html>
<html lang="uk" data-theme="light">

<head>
    <meta charset="utf-8">
    <title>Фінанси</title>
    <base href="/">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Особисті фінанси — дані з Monobank">
    <meta name="theme-color" content="#0b0f16">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <!-- Crisp at any size where the browser takes it; the .ico stays for the rest. -->
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Inter: interface + figures, Latin and Cyrillic · JetBrains Mono: machine values -->
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons+Round">

    <script>
        // Restore saved theme before first paint
        (function() {
            var t = localStorage.getItem('finance-theme');
            if (t === 'dark' || t === 'light') {
                document.documentElement.setAttribute('data-theme', t);
            } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
</head>

<body>
    <app-root></app-root>
</body>

</html>
