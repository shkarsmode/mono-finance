# Pin the compose project name.
#
# This file sets container_name, so the container is claimed by whichever project runs
# compose — and the project name defaults to the DIRECTORY name. That means `docker
# compose up` from /opt/mono-finance/src (project "src") and the same command run from
# anywhere else disagree about who owns `finance-web`, and the second one fails with
# "container name is already in use". Naming the project makes every caller agree.
name: mono-finance

services:
    web:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: finance-web
        restart: unless-stopped
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.finance-web.rule=Host(`web.91.98.164.192.nip.io`)"
            - "traefik.http.routers.finance-web.entrypoints=websecure"
            - "traefik.http.routers.finance-web.tls.certresolver=letsencrypt"
            - "traefik.http.services.finance-web.loadbalancer.server.port=80"
            - "traefik.docker.network=proxy"
            - "traefik.http.routers.finance-web-http.rule=Host(`web.91.98.164.192.nip.io`)"
            - "traefik.http.routers.finance-web-http.entrypoints=web"
            - "traefik.http.routers.finance-web-http.middlewares=redirect-to-https@file"
        networks:
            - proxy

networks:
    proxy:
        external: true
